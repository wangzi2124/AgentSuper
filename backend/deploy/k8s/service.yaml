# Agent Platform K8s Service + HPA（对齐 agent.md §11.1 / §11.4）
apiVersion: v1
kind: Service
metadata:
  name: agent-platform
  labels:
    app: agent-platform
spec:
  selector:
    app: agent-platform
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-platform
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
