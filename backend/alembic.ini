# Alembic configuration (backend/alembic.ini)
# sqlalchemy.url is injected at runtime by app/storage/migrations.py (or CLI env).
# The sqlite backend does not use the migration chain (schema is created
# idempotently on connect from the same metadata); this file is for mysql/postgresql.
# NOTE: keep this file ASCII-only -- alembic reads it with the locale codec.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S