# AgentSuper 同源部署（方案 A）：前端静态文件 + /api 反代后端
#
# 步骤：
#   1) cd frontend && npm run build          # 产物在 frontend/dist
#   2) 把 dist 放到下面 root 指向的目录
#   3) 后端只监听本机：uvicorn main:app --host 127.0.0.1 --port 8000
#   4) 用本文件启动 nginx
#
# 同源（前端和 /api 同一域名）→ 不需要改前端代码、不需要配 CORS。

server {
    listen 80;
    server_name app.example.com;          # 改成你的域名

    root /var/www/agentsuper/dist;        # frontend/dist 的部署路径
    index index.html;

    # SPA history 回退：任意前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE 流式 /api/chat/multi-agent/stream）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长任务：必须关缓冲、拉长超时，否则前端收不到逐字流 / 长任务被掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 附件 / 文档上传
    client_max_body_size 100m;
}

# HTTPS（可选，强烈建议）：certbot 自动生成，或手写 443 server + ssl_certificate
